---
apiVersion: v1
kind: Service
metadata:
  name: '{{ include "name" . }}-postgresql'
spec:
  type: ExternalName
  externalName: '{{ include "name" . }}-cloudnative-pg-cluster-18-pooler-rw.{{ .Release.Namespace }}.svc.cluster.local'
  ports:
    - name: pgbouncer
      port: 5432
      protocol: TCP
      targetPort: pgbouncer
---
# Direct cluster access, bypassing the transaction-mode pooler.
apiVersion: v1
kind: Service
metadata:
  name: '{{ include "name" . }}-postgresql-r'
spec:
  type: ExternalName
  externalName: '{{ include "name" . }}-cloudnative-pg-cluster-18-r.{{ .Release.Namespace }}.svc.cluster.local'
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
