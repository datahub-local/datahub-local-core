# The controller derives the Deployment, Service and cluster DNS name straight
# from MCPServer.metadata.name, so the chart's built-in catalog produced bare
# `github`, `grafana`, `postgres` and `argocd` workloads in a namespace that
# already holds argo-cd-*. defaultMcpServers is off in values/sympozium.yaml.gotmpl
# and the catalog lives here instead; the specs are otherwise the chart's own and
# the secret names are the ones the secrets repo provides. Disabling the catalog
# also drops the chart's k8s-mcp ServiceAccount and ClusterRole, re-created below.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
rules:
  # Cluster-wide read: the enumerated groups this replaces covered no CRD, so
  # agents could not read velero, cnpg, longhorn or cert-manager objects.
  # get/list/watch only, so pods/exec and every write stay denied.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
subjects:
  - kind: ServiceAccount
    name: '{{ include "name" . }}-sympozium-mcp-k8s'
    namespace: '{{ .Release.Namespace }}'
---
# Upstream runs this one as a controller-managed http server, but the server
# answers only on /mcp while the controller publishes the Service root, so every
# k8s_* call 404s. stdio is no way out: the mcp-bridge shares one child session
# across all callers and this server rejects the second initialize. So the
# workload is ours and the MCPServer only points at it, path included. Selector
# labels match what the controller used, so it adopts the existing objects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
spec:
  replicas: 1
  selector:
    matchLabels: &mcpK8sLabels
      app.kubernetes.io/name: mcpserver
      app.kubernetes.io/instance: '{{ include "name" . }}-sympozium-mcp-k8s'
      app.kubernetes.io/managed-by: sympozium
  template:
    metadata:
      # The agent egress policy only opens 8080 towards name=mcpserver.
      labels: *mcpK8sLabels
    spec:
      serviceAccountName: '{{ include "name" . }}-sympozium-mcp-k8s'
      containers:
        - name: mcp-server
          image: ghcr.io/containers/kubernetes-mcp-server:{{ index .Values.container_image_version "ghcr.io/containers/kubernetes-mcp-server" }}
          # Named explicitly: the controller left command=/adapter/mcp-bridge on
          # the Deployment we adopt, and a merge cannot drop what we never set.
          command: ["/app/kubernetes-mcp-server"]
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
spec:
  selector:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: '{{ include "name" . }}-sympozium-mcp-k8s'
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-k8s'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: http
  toolsPrefix: k8s
  timeout: 30
  # Setting url also stops the controller reconciling a deployment of its own.
  url: 'http://{{ include "name" . }}-sympozium-mcp-k8s.{{ .Release.Namespace }}.svc:8080/mcp'
  # Upstream denies delete_resource/create_resource/update_resource, which this
  # server has never had; these are the names it actually registers.
  toolsDeny:
    - pods_delete
    - pods_exec
    - pods_run
    - resources_create_or_update
    - resources_delete
    - resources_scale
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-github'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: stdio
  toolsPrefix: github
  timeout: 30
  # add_issue_comment stays allowed: renovate-reviewer exists to comment on PRs.
  toolsDeny:
    - create_or_update_file
    - push_files
    - create_repository
    - fork_repository
    - create_branch
    - create_issue
    - update_issue
    - create_pull_request
    - create_pull_request_review
    - merge_pull_request
    - update_pull_request_branch
  deployment:
    image: mcp/github:{{ index .Values.container_image_version "mcp/github" }}
    cmd: node
    args:
      - dist/index.js
    secretRefs:
      - name: mcp-github-token
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-grafana'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: stdio
  toolsPrefix: grafana
  timeout: 30
  # grafana_api_request passes through to the whole Grafana API, so the other
  # thirteen denies mean nothing without it.
  toolsDeny:
    - grafana_api_request
    - update_dashboard
    - update_datasource
    - create_datasource
    - create_folder
    - create_annotation
    - update_annotation
    - create_snapshot
    - delete_snapshot
    - create_incident
    - add_activity_to_incident
    - install_plugin
    - alerting_manage_rules
    - alerting_manage_routing
  deployment:
    image: mcp/grafana:{{ index .Values.container_image_version "mcp/grafana" }}
    cmd: /app/mcp-grafana
    args:
      - -t
      - stdio
    secretRefs:
      - name: mcp-grafana-token
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-postgres'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: stdio
  toolsPrefix: pg
  timeout: 60
  # execute_sql is the only write tool; --access-mode below blocks it at the
  # server, so this deny is the backstop rather than the enforcement.
  toolsDeny:
    - execute_sql
  deployment:
    image: crystaldba/postgres-mcp:{{ index .Values.container_image_version "crystaldba/postgres-mcp" }}
    cmd: /app/docker-entrypoint.sh
    args:
      - postgres-mcp
      - --access-mode=restricted
    secretRefs:
      - name: mcp-postgres-token
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-argocd'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: stdio
  toolsPrefix: argocd
  timeout: 30
  # All eleven tools are reads; nothing to deny.
  deployment:
    image: quay.io/argoprojlabs/mcp-for-argocd:{{ index .Values.container_image_version "quay.io/argoprojlabs/mcp-for-argocd" }}
    cmd: node
    args:
      - dist/index.js
      - stdio
    secretRefs:
      - name: mcp-argocd-token
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-slack'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: stdio
  toolsPrefix: slack
  timeout: 30
  deployment:
    image: mcp/slack:{{ index .Values.container_image_version "mcp/slack" }}
    cmd: node
    args:
      - dist/index.js
    secretRefs:
      - name: mcp-slack-token
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: '{{ include "name" . }}-sympozium-mcp-trino'
  labels:
    sympozium.ai/catalog: "true"
spec:
  transportType: stdio
  toolsPrefix: trino
  # Iceberg scans over S3 are slower than the other servers' calls.
  timeout: 60
  # All six tools read: execute_query rejects anything but SELECT/SHOW/DESCRIBE/
  # EXPLAIN while TRINO_ALLOW_WRITE_QUERIES stays false. Nothing to deny.
  deployment:
    image: ghcr.io/tuannvm/mcp-trino:{{ index .Values.container_image_version "ghcr.io/tuannvm/mcp-trino" }}
    cmd: /app/trino-mcp
    env:
      # The image ships MCP_TRANSPORT=http, and the binary defaults the Trino
      # side to https; the coordinator serves plain http on 8080.
      MCP_TRANSPORT: stdio
      TRINO_SCHEME: http
      TRINO_SSL: "false"
      TRINO_HOST: '{{ .Values.release_name }}-data-trino-trino.data.svc'
      TRINO_PORT: "8080"
      # Not the admin Superset uses: the coordinator's rules.json grants this
      # identity read-only on the lake catalogs and nothing else, so the
      # TRINO_ALLOW_WRITE_QUERIES below is the backstop rather than the fence.
      TRINO_USER: '{{ .Values.trino_mcp_user }}'
      TRINO_CATALOG: memory
      TRINO_SCHEMA: default
      TRINO_ALLOW_WRITE_QUERIES: "false"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
