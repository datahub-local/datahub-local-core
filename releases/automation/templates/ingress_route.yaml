---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Velero-UI"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=vui"
    gethomepage.dev/group: "Automation"
    gethomepage.dev/icon: "sh-velero"
    gethomepage.dev/href: "https://automation-vui.{{ .Values.gateway_hostname }}"
  name: '{{ include "name" . }}-vui'
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`automation-vui.{{ .Values.gateway_hostname }}`)
      kind: Rule
      services:
        - name: '{{ include "name" . }}-vui-ui-clusterip-svc'
          port: vui-ui
      middlewares:
        - name: oauth2-proxy-auth
          namespace: security
    - match: Host(`automation-vui.{{ .Values.gateway_hostname }}`) && (PathPrefix(`/ws/`) || PathPrefix(`/api/`))
      kind: Rule
      services:
        - name: '{{ include "name" . }}-vui-api-clusterip-svc'
          port: vui-api
      middlewares:
        - name: oauth2-proxy-auth
          namespace: security
    - match: Host(`automation-vui.{{ .Values.gateway_hostname }}`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: security
          port: http
---
# The API server only knows bearer-token auth, and its SPA gates on that token
# being in localStorage. /auth hands the token over in a URL fragment, which
# never reaches a server; the SPA consumes and stores it, so the login prompt
# never appears. Behind oauth2-proxy, so only signed-in users get the token.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: '{{ include "name" . }}-sympozium-login'
spec:
  redirectRegex:
    regex: "^https?://([^/]+)/auth$"
    replacement: "https://${1}/#token={{ .Values.security_github_client_secret | sha256sum | trunc 32 }}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sympozium"
    gethomepage.dev/pod-selector: "app.kubernetes.io/component=apiserver"
    gethomepage.dev/group: "Automation"
    gethomepage.dev/icon: "mdi-robot-outline"
    gethomepage.dev/href: "https://automation-sympozium.{{ .Values.gateway_hostname }}/auth"
  name: '{{ include "name" . }}-sympozium'
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`automation-sympozium.{{ .Values.gateway_hostname }}`)
      kind: Rule
      services:
        - name: sympozium-apiserver
          port: http
      middlewares:
        - name: oauth2-proxy-auth
          namespace: security
    - match: Host(`automation-sympozium.{{ .Values.gateway_hostname }}`) && Path(`/auth`)
      kind: Rule
      services:
        - name: sympozium-apiserver
          port: http
      middlewares:
        - name: oauth2-proxy-auth
          namespace: security
        - name: '{{ include "name" . }}-sympozium-login'
    - match: Host(`automation-sympozium.{{ .Values.gateway_hostname }}`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: security
          port: http
