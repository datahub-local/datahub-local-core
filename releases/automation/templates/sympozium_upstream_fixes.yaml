# Workarounds for upstream sympozium chart/controller bugs, kept together so they
# can be dropped as a group once fixed. Patches to chart-rendered resources live in
# ../values/_kustomize.yaml.gotmpl instead; kustomize cannot add new resources.
#
# 1. sympozium-agent-allow-eventbus omits shared memory and MCPServer, so
#    agent-deny-all blocks both.
# 2. The controller injects a hardcoded nats.sympozium-system.svc into every agent
#    ipc-bridge, ignoring its own NATS_URL.
# 3. sympozium-allow-otel selects app.kubernetes.io/part-of=sympozium, a label no
#    controller-created pod carries, so agent and channel pods keep no OTLP egress
#    past their deny-all and log export failures on a loop.
# 4. sympozium-web-proxy-allow-ingress selects sympozium.ai/component=web-proxy,
#    but the controller labels those pods sympozium.ai/component=agent-server, so
#    the policy matches nothing. The web-proxy pods *do* carry
#    app.kubernetes.io/part-of=sympozium — note that this makes the comment in (3)
#    wrong for them — so sympozium-allow-otel becomes the only Egress policy
#    selecting them, and its 4317/4318 allowance is therefore a deny of everything
#    else. The endpoint serves /healthz and rejects an unauthenticated call
#    correctly, then fails every real request on
#    `Get "https://10.43.0.1:443/api": connect: connection refused`, because the
#    proxy needs the API server to create the AgentRun it is serving.
# 5. Nothing retires an AgentRun, and each run's skill Role and RoleBinding are
#    owned by it, so retained runs pin their RBAC. Pruned on a schedule below.
# 6. Only the schedule controller copies a persona's toolPolicy onto the AgentRun
#    it creates. A run started from a channel message or the web endpoint is
#    built from the Agent object, whose CRD has no toolPolicy field, so it is
#    handed the whole built-in tool set. Given a floor at admission below.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ include "name" . }}-sympozium-agent-allow-tools'
spec:
  podSelector:
    matchExpressions:
      - key: sympozium.ai/role
        operator: In
        values: ["agent"]
      - key: sympozium.ai/sandbox
        operator: DoesNotExist
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              sympozium.ai/component: shared-memory
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcpserver
---
apiVersion: v1
kind: Namespace
metadata:
  name: sympozium-system
  annotations:
    # Must exist before the Service below.
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: sympozium-system
spec:
  type: ExternalName
  externalName: nats.automation.svc.cluster.local
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ include "name" . }}-sympozium-agent-allow-otel'
spec:
  podSelector:
    matchExpressions:
      - key: sympozium.ai/role
        operator: In
        values: ["agent"]
      # The sandbox is meant to reach nothing but its siblings.
      - key: sympozium.ai/sandbox
        operator: DoesNotExist
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sympozium-otel-collector
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ include "name" . }}-sympozium-channel-allow-otel'
spec:
  podSelector:
    matchLabels:
      sympozium.ai/component: channel
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sympozium-otel-collector
---
# Fix (4): give the web-proxy pods the egress its own chart policy intended,
# selecting the label the controller actually sets. Scoped tightly — as of
# 2026-08-23 exactly the five homelab-ops web-endpoint-server pods carry
# sympozium.ai/component=agent-server and nothing else does:
#
#   kubectl get pods -A -l sympozium.ai/component=agent-server
#
# Ports mirror the upstream sympozium-web-proxy-allow-ingress rules rather than
# being derived independently, so this can be deleted verbatim once that policy
# selects the right label. `to:` is deliberately omitted on the API-server rule:
# the endpoint is a Service ClusterIP, not a pod, so no podSelector can name it.
#
# No OTLP rule here: sympozium-allow-otel already grants these pods 4317/4318 —
# that is precisely the problem, since a single matching Egress policy narrows a
# pod to the union of matching rules. Egress policies add, so this one widens
# that union rather than replacing it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ include "name" . }}-sympozium-web-proxy-allow-egress'
spec:
  podSelector:
    matchLabels:
      sympozium.ai/component: agent-server
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The Kubernetes API. The proxy watches Agents and creates an AgentRun per
    # request, so without this the endpoint authenticates callers and then fails
    # every one of them.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - ports:
        - port: 4222
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
    # Ollama, as the upstream policy allows. 11435 is the metrics-proxy sidecar
    # the Service targets; 11434 is Ollama itself — same pair as
    # networkPolicies.extraEgressPorts in ../values/sympozium.yaml.gotmpl.
    - ports:
        - port: 11434
          protocol: TCP
        - port: 11435
          protocol: TCP
---
# Fix (5): nothing retires an AgentRun. The controller gives each run's skill
# Role and RoleBinding an ownerReference on the AgentRun, so retained runs pin
# their RBAC too — 109 pairs had accumulated in `automation` by 2026-08-24.
# There is no knob for this: AgentRun has no TTL, SympoziumSchedule has no
# history limit, and the chart exposes no retention. Deleting the run collects
# its Role and RoleBinding with it. Completed runs only, so nothing in flight is
# touched; `status.completedAt` is set exactly when a run finishes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ include "name" . }}-sympozium-run-pruner'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: '{{ include "name" . }}-sympozium-run-pruner'
rules:
  - apiGroups: ["sympozium.ai"]
    resources: ["agentruns"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: '{{ include "name" . }}-sympozium-run-pruner'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "name" . }}-sympozium-run-pruner'
subjects:
  - kind: ServiceAccount
    name: '{{ include "name" . }}-sympozium-run-pruner'
    namespace: '{{ .Release.Namespace }}'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: '{{ include "name" . }}-sympozium-run-pruner'
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: '{{ include "name" . }}-sympozium-run-pruner'
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pruner
              image: alpine/k8s:{{ index .Values.container_image_version "alpine/k8s" }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                # Runs older than this are deleted. Raise it if a run's history
                # is still wanted; the RBAC pair lives exactly as long.
                - name: RETAIN_DAYS
                  value: "7"
                - name: NAMESPACE
                  value: '{{ .Release.Namespace }}'
                # kubectl writes its discovery cache under $HOME; the root
                # filesystem is read-only.
                - name: HOME
                  value: /tmp
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  CUTOFF=$(( $(date -u +%s) - RETAIN_DAYS * 86400 ))
                  kubectl get agentruns -n "$NAMESPACE" -o json \
                    | jq -r --argjson c "$CUTOFF" '
                        .items[]
                        | select(.status.completedAt != null)
                        | select((.status.completedAt | fromdateiso8601) < $c)
                        | .metadata.name' \
                    | tee /dev/stderr \
                    | xargs -r -n 25 kubectl delete agentrun -n "$NAMESPACE" --ignore-not-found
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
# Fix (6): a default toolPolicy for AgentRuns created without one.
#
# `SympoziumSchedule` copies the persona's `toolPolicy` onto each run it creates.
# Nothing else does. A run started from an inbound channel message or from the
# web endpoint is built from the `Agent` object, which carries `mcpServers` and
# `policyRef` at `spec` and per-agent config at `spec.agents.default`, but no
# `toolPolicy` at any path — so those runs get every built-in tool. Observed 2026-08-24: a Slack @-mention of
# `homelab-ops/sre-sentinel` produced a run whose agent container logged zero
# `tool policy:` lines against the same persona's 13, registered 14 tools rather
# than 13, and opened with
# `execute_command {"command":"kubectl get nodes","target":"k8s-ops"}`.
#
# Scope, honestly: this removes the denied tools from the schema the model is
# offered, which is the observed path — the model reaches for what it is handed.
# It is NOT a hard boundary. `toolPolicy` is applied at schema registration and
# not at dispatch, so a model that produces a denied tool name from anywhere else
# still gets it executed; that half is an upstream fix. The hard boundaries that
# do hold are `mcpServers[].toolsAllow`, which runs at the MCP bridge and does
# bound those tools on this path, and the absence of a skill sidecar, without
# which `execute_command` has nothing to run it.
#
# MCP tools are deliberately absent from the deny list: they are already bounded
# per-agent, and a fleet-wide deny here would break every persona. Deny rather
# than allow because admission cannot know which persona a run belongs to, and
# the runner treats the two lists independently — a scheduled run logs both
# `denied tool "execute_command"` and `tool "read_file" not in allow list`.
#
# Drop this once the Agent CRD carries toolPolicy upstream.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: '{{ include "name" . }}-sympozium-agentrun-default-toolpolicy'
spec:
  # Fail closed. A guard that fails open is the failure mode this whole file
  # exists for — but it does mean a patch error rejects every run it matches, so
  # probe with a hand-applied AgentRun after any change here. Rendering and a
  # --dry-run=server of the policy are not enough: both passed while
  # patchType: ApplyConfiguration was rejecting every AgentRun it matched, since
  # the atomic-array check only runs when the patch meets a real object. The
  # probe needs an Agent to exist, or the validating webhook rejects first and
  # masks the result.
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: ["sympozium.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["agentruns"]
  matchConditions:
    # Runs that already carry a policy — every scheduled one — are untouched.
    - name: has-no-toolpolicy
      expression: "!has(object.spec.toolPolicy)"
  mutations:
    # JSONPatch, not ApplyConfiguration. CRD list fields are atomic unless the
    # schema says otherwise, and ApplyConfiguration refuses to mutate an atomic
    # array: it fails at runtime with `may not mutate atomic arrays, maps or
    # structs: .spec.toolPolicy.deny`, which failurePolicy: Fail turns into a
    # rejected AgentRun. Adding the whole toolPolicy object as a JSONPatch skips
    # the merge machinery. Safe because matchConditions proves it is absent.
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add",
              path: "/spec/toolPolicy",
              value: {
                "deny": [
                  "execute_command",
                  "write_file",
                  "edit_file",
                  "fetch_url",
                  "delegate_to_persona",
                  "schedule_task",
                  "workflow_memory_store"
                ]
              }
            }
          ]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: '{{ include "name" . }}-sympozium-agentrun-default-toolpolicy'
spec:
  policyName: '{{ include "name" . }}-sympozium-agentrun-default-toolpolicy'
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: '{{ .Release.Namespace }}'
